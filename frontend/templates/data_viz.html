{% extends "base.html" %}

{% block content %}
<h1>🎨 Data-Driven Creative Visualization</h1>

<div class="button-group" style="justify-content:center; margin-bottom:1.5rem;">
  <a class="btn" href="/data-viz?model=energy">⚡ Energy Density</a>
  <a class="btn" href="/data-viz?model=heatmap">🔥 Weekly Heatmap</a>
  <a class="btn" href="/data-viz?model=mandala">🌀 Mandala Polaire</a>
  <a class="btn" href="/data-viz?model=bubble">🫧 Bubble Interactive</a>
  <a class="btn" href="/data-viz?model=sunburst">🌞 Sunburst Interactive</a>
</div>

{% if image %}
<div class="image-container">
  <h3>Résultat :</h3>
  <img src="{{ url_for('media_file', filename=image) }}" alt="Data visualization">
</div>
{% endif %}

{% if html_plot %}
<div class="image-container">
  <iframe src="{{ url_for('static', filename=html_plot) }}"
          width="100%" height="700"
          style="border:none; border-radius:var(--radius-md);"></iframe>
</div>
{% endif %}

<div style="text-align:center; margin:2rem 0;">
  <h2>
    The link of dataset is
    <a href="https://www.kaggle.com/code/sonalshinde123/behavioral-analysis-of-gym-attendance/input"
       target="_blank"
       style="display:inline-block;padding:8px 16px;border-radius:var(--radius-md);background:var(--secondary-500);color:white;font-size:1.1rem;margin-left:0.5rem;">
      here
    </a>
  </h2>
</div>
{% endblock %}
